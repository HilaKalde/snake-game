<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סנייק</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e1b4b;
    --panel: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #4ade80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: radial-gradient(circle at top, var(--bg2), var(--bg1));
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  h1 {
    margin: 0;
    font-size: 2.4rem;
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
  }

  .scores {
    display: flex;
    gap: 12px;
  }

  .score-box {
    min-width: 110px;
    padding: 8px 16px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    text-align: center;
  }

  .score-box span {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .score-box strong {
    font-size: 1.6rem;
  }

  .board {
    position: relative;
    width: min(400px, 100%);
    aspect-ratio: 1;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(3px);
    text-align: center;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    margin: 0;
    font-size: 1.8rem;
  }

  .overlay p {
    margin: 0;
    color: var(--muted);
  }

  button {
    padding: 10px 28px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #052e16;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s;
  }

  button:hover { transform: scale(1.05); }

  .hint {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
  }
</style>
</head>
<body>

<h1>🐍 סנייק</h1>

<div class="scores">
  <div class="score-box"><span>ניקוד</span><strong id="score">0</strong></div>
  <div class="score-box"><span>שיא</span><strong id="best">0</strong></div>
</div>

<div class="board">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">מוכנים?</h2>
    <p id="overlay-text">אכלו כמה שיותר תפוחים</p>
    <button id="start">התחל</button>
  </div>
</div>

<p class="hint">חיצים / WASD להזזה · רווח להשהיה · החלקה בנייד</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const overlayText = document.getElementById("overlay-text");
const startBtn = document.getElementById("start");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

const size = 20;
const cells = canvas.width / size;

let snake, dir, nextDir, food, score, timer;
let running = false;
let paused = false;
let best = 0;

try { best = Number(localStorage.getItem("snake-best")) || 0; } catch (e) {}
bestEl.textContent = best;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function start() {
  reset();
  overlay.classList.add("hidden");
  running = true;
  clearInterval(timer);
  timer = setInterval(step, 110);
}

function gameOver() {
  running = false;
  clearInterval(timer);
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem("snake-best", best); } catch (e) {}
  }
  overlayTitle.textContent = "המשחק נגמר";
  overlayText.textContent = "ניקוד: " + score;
  startBtn.textContent = "שחק שוב";
  overlay.classList.remove("hidden");
}

function togglePause() {
  if (running) {
    running = false;
    paused = true;
    clearInterval(timer);
    overlayTitle.textContent = "השהיה";
    overlayText.textContent = "לחצו רווח כדי להמשיך";
    startBtn.textContent = "המשך";
    overlay.classList.remove("hidden");
  } else {
    running = true;
    paused = false;
    overlay.classList.add("hidden");
    timer = setInterval(step, 110);
  }
}

// רווח או כפתור: ממשיך אם בהשהיה, אחרת מתחיל משחק חדש
function mainAction() {
  if (running || paused) togglePause();
  else start();
}

function setDir(x, y) {
  // אי אפשר להסתובב אחורה
  if (dir.x === -x && dir.y === -y) return;
  nextDir = { x, y };
}

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "w") setDir(0, -1);
  else if (k === "arrowdown" || k === "s") setDir(0, 1);
  else if (k === "arrowleft" || k === "a") setDir(-1, 0);
  else if (k === "arrowright" || k === "d") setDir(1, 0);
  else if (k === " ") {
    e.preventDefault();
    mainAction();
    return;
  } else return;
  e.preventDefault();
});

startBtn.addEventListener("click", () => {
  startBtn.blur();
  mainAction();
});

// החלקה בנייד
let touchX, touchY;
canvas.addEventListener("touchstart", e => {
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
  else setDir(0, Math.sign(dy));
});

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // פגיעה בקיר או בעצמו
  if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

function draw() {
  // לוח משובץ
  for (let x = 0; x < cells; x++) {
    for (let y = 0; y < cells; y++) {
      ctx.fillStyle = (x + y) % 2 ? "#111827" : "#0f172a";
      ctx.fillRect(x * size, y * size, size, size);
    }
  }

  // תפוח זוהר
  const fx = food.x * size + size / 2;
  const fy = food.y * size + size / 2;
  ctx.shadowColor = "#f43f5e";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#f43f5e";
  ctx.beginPath();
  ctx.arc(fx, fy, size / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(fx - 1, fy - size / 2, 2, 5);

  // נחש — צבע מתבהר לכיוון הזנב
  snake.forEach((s, i) => {
    const light = 55 - (i / snake.length) * 25;
    ctx.fillStyle = `hsl(142, 70%, ${light}%)`;
    roundRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2, i === 0 ? 7 : 5);
  });

  // עיניים
  const h = snake[0];
  const cx = h.x * size + size / 2;
  const cy = h.y * size + size / 2;
  const px = -dir.y * 5, py = dir.x * 5;
  const ex = dir.x * 3, ey = dir.y * 3;
  ctx.fillStyle = "#fff";
  [1, -1].forEach(side => {
    ctx.beginPath();
    ctx.arc(cx + px * side + ex, cy + py * side + ey, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.fillStyle = "#000";
  [1, -1].forEach(side => {
    ctx.beginPath();
    ctx.arc(cx + px * side + ex * 1.5, cy + py * side + ey * 1.5, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

reset();
draw();
</script>
</body>
</html>
