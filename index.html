<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>סנייק</title>
<style>
  body { background: #222; color: #fff; font-family: sans-serif; text-align: center; }
  canvas { background: #000; border: 2px solid #fff; }
</style>
</head>
<body>
<h1>סנייק</h1>
<p>ניקוד: <span id="score">0</span></p>
<canvas id="game" width="400" height="400"></canvas>
<p>משחקים עם החיצים</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const size = 20;
const cells = canvas.width / size;

let snake, dir, food, score;

function reset() {
  snake = [{ x: 10, y: 10 }];
  dir = { x: 1, y: 0 };
  score = 0;
  placeFood();
}

function placeFood() {
  food = {
    x: Math.floor(Math.random() * cells),
    y: Math.floor(Math.random() * cells)
  };
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && dir.y === 0) dir = { x: 0, y: -1 };
  if (e.key === "ArrowDown" && dir.y === 0) dir = { x: 0, y: 1 };
  if (e.key === "ArrowLeft" && dir.x === 0) dir = { x: -1, y: 0 };
  if (e.key === "ArrowRight" && dir.x === 0) dir = { x: 1, y: 0 };
});

function step() {
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // פגיעה בקיר או בעצמו
  if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    alert("המשחק נגמר! ניקוד: " + score);
    reset();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "red";
  ctx.fillRect(food.x * size, food.y * size, size, size);

  ctx.fillStyle = "lime";
  snake.forEach(s => ctx.fillRect(s.x * size, s.y * size, size - 1, size - 1));

  document.getElementById("score").textContent = score;
}

reset();
setInterval(step, 120);
</script>
</body>
</html>
